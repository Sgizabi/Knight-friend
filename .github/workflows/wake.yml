name: The knight wakes
run-name: ${{ github.event_name == 'schedule' && 'Scheduled check-in' || ((inputs.check_in == true || inputs.check_in == 'true') && 'Alarm check-in' || 'Woken by hand') }}

on:
  schedule:
    # GitHub runs scheduled jobs "best effort" and often drops some, so this checks in
    # three times an hour; the knight itself only wakes once ~2 hours have passed
    # (see WAKE_GAP_MINUTES in brain/knight.py). A check-in that isn't due takes a few
    # seconds and commits nothing.
    - cron: "7,27,47 * * * *"
    # The long evening by the fire, about 9:40 PM US Eastern (times here are UTC).
    # Three tries in case one is dropped; it only happens once a night.
    # If you change these, change the same three lines in KNIGHT_SESSION below.
    - cron: "37 2 * * *"
    - cron: "17 3 * * *"
    - cron: "57 3 * * *"
  # The "Run workflow" button. Pressed by hand, it always wakes the knight.
  # The outside alarm clock (cron-job.org, every 20 minutes) presses it with check_in on,
  # because GitHub's own schedule above has been unreliable: then it only wakes the
  # knight if a wake-up is actually due, exactly like a scheduled check-in.
  workflow_dispatch:
    inputs:
      session:
        description: "How long should it stay awake?"
        type: choice
        options: [short, long]
        default: short
      check_in:
        description: "Just a check-in (only wake if it's time)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: knight
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KNIGHT_SCHEDULED: ${{ (github.event_name == 'schedule' || inputs.check_in == true || inputs.check_in == 'true') && '1' || '' }}
      KNIGHT_SESSION: ${{ (github.event.schedule == '37 2 * * *' || github.event.schedule == '17 3 * * *' || github.event.schedule == '57 3 * * *') && 'long' || inputs.session || 'short' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Is it time?
        id: due
        run: python brain/knight.py --is-due >> "$GITHUB_OUTPUT"
      # A practice wake-up on a throwaway copy of its world (no AI, no internet, no commits).
      # If the code is broken, this fails and the real wake-up below never runs, so a bad
      # update can't touch the knight's real memories.
      - name: Practice run first
        if: steps.due.outputs.due == 'true'
        env:
          KNIGHT_SCHEDULED: ""
          KNIGHT_PRACTICE: "1"
          KNIGHT_ROUND_PAUSE: "0"
        run: |
          python -m py_compile brain/*.py streamlit_app.py
          python brain/selftest.py
          practice="$(mktemp -d)"
          cp -r world docs "$practice"/
          KNIGHT_ROOT="$practice" python brain/knight.py --fake
      # Does what the check above decided: a full wake-up, a night's sleep (no AI), or a
      # light check-in (one passing thought, maybe a change of plan).
      - name: Wake the knight
        if: steps.due.outputs.due == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MODE: ${{ steps.due.outputs.mode }}
        run: |
          git config user.name "the-knight"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python brain/knight.py --mode "$MODE"
