<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; media-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'"><meta name="referrer" content="no-referrer">
<meta charset="utf-8">
<title>Bathhouse Builder – Shim Summary (Enhanced)</title>
<style>
body{font-family:sans-serif;background:#f0f0f0;margin:0;padding:1em;color:#333}
h1{margin-top:0}
#stack{border:2px solid #555;background:#fff;width:200px;height:200px;margin:auto;position:relative}
.block{position:absolute;width:100%;height:20px;background:#a2d5f2;box-sizing:border-box;border:1px solid #555}
#log,#summary{margin-top:1em;padding:5px;background:#fff;border:1px solid #555;max-height:150px;overflow:auto}
button,select{margin:0.3em}
</style>
</head>
<body>
<h1>Bathhouse Floor Shim Stacker</h1>

<div>
  <label for="section">Section:</label>
  <select id="section">
    <option value="0">0</option>
    <option value="1">1</option>
    <option value="2">2</option>
  </select>
  <button id="add">Add Shim</button>
  <button id="remove">Remove Shim</button>
  <button id="reset">Reset Section</button>
  <button id="resetAll">Reset All</button>
  <button id="export">Export CSV</button>
  <button id="test">Test Stability</button>
  <button id="clearLog">Clear Log</button>
</div>

<div id="stack"></div>

<div id="summary">
  <div id="sectionSum">Section 0 total: 0</div>
  <div id="overallSum">Overall shims this floor: 0</div>
</div>
<div id="log"></div>

<script>
let currentSection = 0;
const sections = [
  {level:0,total:0},
  {level:0,total:0},
  {level:0,total:0}
];

const stack = document.getElementById('stack');
const log   = document.getElementById('log');
const sel   = document.getElementById('section');
const sectionSum = document.getElementById('sectionSum');
const overallSum = document.getElementById('overallSum');

function draw(){
  const sec = sections[currentSection];
  stack.innerHTML='';
  for(let i=0;i<sec.level;i++){
    const d=document.createElement('div');
    d.className='block';
    d.style.bottom=(i*20)+'px';
    stack.appendChild(d);
  }
  sectionSum.textContent='Section '+currentSection+' total: '+sec.total;
  overallSum.textContent='Overall shims this floor: '+sections.reduce((a,s)=>a+s.total,0);
}
function add(){
  const s=sections[currentSection];
  s.level++; s.total++;
  logMsg('Added shim '+s.level+' to section '+currentSection);
  draw();
}
function rem(){
  const s=sections[currentSection];
  if(s.level){
    logMsg('Removed shim '+s.level+' from section '+currentSection);
    s.level--; draw();
  }
}
function reset(){
  if(!confirm('Reset section '+currentSection+'? All shims will be lost.')) return;
  const s=sections[currentSection];
  if(s.level) logMsg('Reset section '+currentSection+', removed '+s.level+' shims');
  s.level=0; s.total=0; draw();
}
function resetAll(){
  if(!confirm('Reset all sections? This cannot be undone.')) return;
  sections.forEach(s=>{s.level=0;s.total=0;});
  logMsg('All sections cleared');
  draw();
}
function test(){
  const wobble=Math.random();
  if(wobble<0.2) logMsg('Floor stable. No wobble.');
  else if(wobble<0.6) logMsg('Slight wobble. Might need another shim.');
  else logMsg('Unstable! Too many shims, risk of collapse.');
}
function clearLog(){ log.innerHTML=''; }
function logMsg(msg){
  const p=document.createElement('p');
  p.textContent=msg;
  log.appendChild(p);
  log.scrollTop=log.scrollHeight;
}
function exportCSV(){
  let csv='section,level,total\n';
  sections.forEach((s,i)=>{csv+=i+','+s.level+','+s.total+'\n';});
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='shim_summary.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}
sel.onchange=()=>{currentSection=+sel.value;draw();};
document.getElementById('add').onclick=add;
document.getElementById('remove').onclick=rem;
document.getElementById('reset').onclick=reset;
document.getElementById('resetAll').onclick=resetAll;
document.getElementById('test').onclick=test;
document.getElementById('clearLog').onclick=clearLog;
document.getElementById('export').onclick=exportCSV;
draw();
</script>
</body>
</html>
