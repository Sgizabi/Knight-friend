<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; media-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'"><meta name="referrer" content="no-referrer">
<meta charset="UTF-8">
<title>Bathhouse Builder – Updated</title>
<style>
  body{font-family:sans-serif;background:#f0f0f0;margin:0;padding:1em}
  #grid{display:grid;grid-template-columns:repeat(10,30px);gap:2px;margin-bottom:1em}
  .cell{width:30px;height:30px;background:#ddd;cursor:pointer;box-sizing:border-box;position:relative}
  .wall{background:#555}
  .water{background:#4da6ff}
  .shim{background:#ffb84d}
  .unstable{outline:3px solid red;outline-offset:-3px}
  #tools button{margin-right:.5em}
  #flow{margin-top:1em;font-size:0.9em}
</style>
</head>
<body>
<h2>Bathhouse Builder</h2>
<div id="tools">
  <button data-mode="wall">Wall</button>
  <button data-mode="water">Water</button>
  <button data-mode="clear">Clear</button>
  <button id="addShim">Add Shim</button>
  <button id="test">Test Stability</button>
</div>
<div id="grid"></div>
<div id="flow"></div>

<script>
const rows=10, cols=10;
let mode='wall';
document.querySelectorAll('#tools button[data-mode]').forEach(b=>{
  b.onclick=()=>{mode=b.dataset.mode};
});
document.getElementById('addShim').onclick=addShim;
document.getElementById('test').onclick=testStability;

const grid=document.getElementById('grid');
for(let i=0;i<rows*cols;i++){
  const c=document.createElement('div');
  c.className='cell';
  c.dataset.state='empty';
  c.dataset.index=i;
  c.onclick=()=>toggle(c);
  grid.appendChild(c);
}

function toggle(cell){
  if(mode==='wall'){
    cell.className='cell wall';
    cell.dataset.state='wall';
  }else if(mode==='water'){
    if(cell.dataset.state!=='wall'){
      cell.className='cell water';
      cell.dataset.state='water';
    }
  }else{
    cell.className='cell';
    cell.dataset.state='empty';
  }
}

function addShim(){
  // find first empty floor cell (non‑wall) and mark as shim
  for(const c of grid.children){
    if(c.dataset.state==='empty'){
      c.className='cell shim';
      c.dataset.state='shim';
      break;
    }
  }
}

function testStability(){
  // any wall cell not supported by a floor (wall or shim) beneath is unstable
  // simple rule: if a wall has empty below it, mark unstable
  for(const c of grid.children){
    c.classList.remove('unstable');
  }
  for(let i=0;i<grid.children.length;i++){
    const cell=grid.children[i];
    if(cell.dataset.state!=='wall') continue;
    const belowIdx=i+cols;
    if(belowIdx<grid.children.length){
      const below=grid.children[belowIdx];
      if(below.dataset.state==='empty'){
        cell.classList.add('unstable');
      }
    }
  }
  drawFlow();
}

function drawFlow(){
  // basic flow diagram: list water cells and where they could go (downward if empty)
  const lines=[];
  for(let i=0;i<grid.children.length;i++){
    const cell=grid.children[i];
    if(cell.dataset.state!=='water') continue;
    const belowIdx=i+cols;
    if(belowIdx<grid.children.length){
      const below=grid.children[belowIdx];
      if(below.dataset.state==='empty'){
        lines.push(`Water at (${i%cols},${Math.floor(i/cols)}) → (${belowIdx%cols},${Math.floor(belowIdx/cols)})`);
      }
    }
  }
  const flowDiv=document.getElementById('flow');
  flowDiv.textContent=lines.length?lines.join(' | ') : 'No water flow detected.';
}
</script>
</body>
</html>
