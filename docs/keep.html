<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- already dark: tells browsers with a "force dark mode" not to recolour it -->
<meta name="color-scheme" content="dark">
<title>The Keep</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root { color-scheme:dark; --ink:#efe4d0; --dim:#a8987f; --ember:#f0a04b; --panel:rgba(16,12,10,.78); --line:#4a3c30; }
  html, body { margin:0; height:100%; background:#0b0908; color:var(--ink); font-family:'VT323', monospace; overflow:hidden; }
  #view { position:fixed; inset:0; }
  canvas { display:block; touch-action:none; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; }
  #who { position:fixed; top:10px; left:10px; padding:6px 12px 8px; min-width:190px; max-width:calc(100vw - 40px); }
  #who h1 { margin:0; font-size:26px; font-weight:normal; line-height:1; }
  #who small { display:block; color:var(--dim); font-size:16px; margin:2px 0 6px; }
  .need { display:grid; grid-template-columns:92px 1fr; align-items:center; gap:6px; font-size:16px; color:var(--dim); }
  .need span { white-space:nowrap; }
  #who .need small { display:inline; font-size:11px; color:var(--ink); }
  .need i { display:block; height:7px; border-radius:9px; background:#2a221c; overflow:hidden; }
  .need i b { display:block; height:100%; border-radius:9px; transition:width 1s; }
  #top { position:fixed; top:10px; right:10px; display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content:flex-end; max-width:60vw; }
  #top button, #top select { font:inherit; font-size:18px; color:var(--ink); background:var(--panel); border:1px solid var(--line);
                             border-radius:99px; padding:1px 12px; cursor:pointer; }
  #top button.on { color:#ffd27a; border-color:#b8742c; }
  #wx { font-size:18px; padding:1px 10px; border-radius:99px; background:var(--panel); border:1px solid var(--line); color:var(--dim); white-space:nowrap; }
  #badge { font-size:18px; padding:1px 12px; border-radius:99px; background:var(--panel); border:1px solid var(--line); color:var(--dim); }
  #badge.awake { color:#ffd27a; border-color:#b8742c; box-shadow:0 0 12px rgba(240,160,75,.45); }
  #badge.awake::before { content:'● '; animation:pulse 1.4s infinite; }
  #badge.unwell { color:#d9a7a0; border-color:#8a4a42; }
  @keyframes pulse { 50% { opacity:.25; } }
  #help { position:fixed; top:52px; right:10px; padding:8px 12px; font-size:17px; color:var(--dim); line-height:1.3; display:none; max-width:300px; }
  #help b { color:var(--ink); font-weight:normal; }
  #caption { position:fixed; left:50%; bottom:14px; transform:translateX(-50%); padding:4px 16px; text-align:center;
             font-size:21px; max-width:min(92vw, 720px); }
  #caption em { display:block; color:var(--dim); font-style:normal; font-size:17px; }
  .bubble { position:fixed; transform:translate(-50%, -100%); background:#f6efe2; color:#1a120c; border:2px solid #1a120c;
            border-radius:8px; padding:0 8px; font-size:24px; line-height:1.2; pointer-events:none; white-space:nowrap; transition:opacity .25s; }
  .bubble::after { content:''; position:absolute; left:50%; bottom:-8px; margin-left:-6px; border:6px solid transparent;
                   border-top-color:#1a120c; border-bottom:0; }
  .bubble.anger { color:#b8261b; } .bubble.heart { color:#c2334a; } .bubble.music { color:#3d5b9c; }
  /* its passing thoughts: a wider, softer bubble that fits a sentence */
  .bubble.thought { white-space:normal; width:max-content; max-width:min(250px, 70vw); font-size:18px; line-height:1.25;
                    padding:5px 11px; border-radius:14px; text-align:left; color:#2a1d14; }
  #card { position:fixed; left:50%; top:14px; transform:translateX(-50%); padding:8px 16px; max-width:min(80vw, 420px);
          text-align:center; display:none; font-size:20px; }
  #card small { display:block; color:var(--dim); font-size:16px; }
  #crosshair { position:fixed; left:50%; top:50%; width:6px; height:6px; margin:-3px 0 0 -3px; border-radius:50%;
               background:rgba(255,230,190,.85); box-shadow:0 0 0 1px rgba(0,0,0,.6); display:none; pointer-events:none; }
  #toast { position:fixed; top:52px; right:10px; color:var(--ember); font-size:17px; opacity:0; transition:opacity .4s; pointer-events:none; }
  @media (max-width: 560px) {
    #who { transform:scale(.85); transform-origin:top left; }
    #top { top:auto; bottom:84px; right:8px; flex-wrap:wrap; justify-content:flex-end; }
    #help { top:auto; bottom:120px; }
  }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="view"></div>
<div id="who" class="panel"><h1 id="name"></h1><small id="epithet"></small><div id="needs"></div></div>
<div id="top">
  <span id="wx"></span>
  <span id="badge"></span>
  <button id="cam" title="Follow the knight or roam freely (F)"></button>
  <select id="quality" title="Graphics quality">
    <option value="auto">Auto</option><option value="high">High</option>
    <option value="medium">Medium</option><option value="low">Low</option>
  </select>
  <button id="logbtn" title="Toss a log on the fire (only on your screen: Rooken doesn't see it)">🪵</button>
  <button id="helpbtn" title="Controls">?</button>
</div>
<div id="help" class="panel"></div>
<div id="toast"></div>
<div id="crosshair"></div>
<div id="card" class="panel"></div>
<div class="bubble" id="bubble"></div>
<div id="caption" class="panel"></div>
<script id="knight-data" type="application/json">__DATA__</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

// =====================================================================================
// Where the knight's life comes from
//   * on its website (GitHub Pages): data/state.json next to this page
//   * inside the Streamlit page: injected into the script tag above
//   * ?demo in the address: a made-up knight, for previewing the keep
// =====================================================================================
const params = new URLSearchParams(location.search);
const DEMO = params.has('demo');
const CREATURE = DEMO ? params.get('creature') : null;   // a preview of a creature that might one day visit (creatures.js)
let skyHour = DEMO && params.has('hour') ? +params.get('hour') : null;   // previews: a fixed time of day
let fireDim = 1;   // previews: something eating the light
const onTick = [];   // previews: creatures animate here
const beings = new Map();   // beings at the keep now: appearance id -> what spawn() returned
let creatureMod = null, beingsReady = false;   // (the loader runs once the page has started)
const HOME = 'https://knight-friend.streamlit.app';   // its home page, where visitors knock, leave gifts and so on
let injected = null;
try { injected = JSON.parse($('knight-data').textContent); } catch { /* not injected: we're on the website */ }
let ASSETS = injected ? (injected.asset_base ?? null) : '';
const svgCache = (injected && injected.svgs) || {};
let state = injected ? injected.state : null;

// =====================================================================================
// Renderer, scene, camera
// =====================================================================================
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;          // shadows are redrawn on our own schedule
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
$('view').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2('#0b0908', .05);
const camera = new THREE.PerspectiveCamera(45, 1, .1, 400);
camera.position.set(2.2, 2.6, 7.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, .9, 0);
controls.enableDamping = true;
controls.maxDistance = 12;
controls.maxPolarAngle = 1.5;

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

// =====================================================================================
// The faceted look, and baking everything that never moves into a few meshes
// =====================================================================================
function hash(x, y, z) { const s = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453; return s - Math.floor(s); }
function rand(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
function facet(geo, amount = .01, seed = 0) {
  if (geo.index) geo = geo.toNonIndexed();
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const kx = Math.round(x * 1000), ky = Math.round(y * 1000), kz = Math.round(z * 1000);
    p.setXYZ(i, x + (hash(kx, ky, kz + seed) - .5) * amount, y + (hash(ky, kz, kx + seed) - .5) * amount,
                z + (hash(kz, kx, ky + seed) - .5) * amount);
  }
  geo.computeVertexNormals();
  return geo;
}
const mats = {};
function mat(color, metal = 0, rough = .9, extra = {}) {
  const key = color + metal + rough + JSON.stringify(extra);
  return mats[key] ??= new THREE.MeshStandardMaterial({ color, metalness: metal, roughness: rough, flatShading: true, ...extra });
}
const M = {
  steel: mat('#9aa3ad', .6, .42), steelD: mat('#5f666e', .6, .5), steelL: mat('#c4cbd2', .65, .35),
  visor: mat('#0a0b0d', .2, .9), tabard: mat('#3f5f48', 0, .95), tabardD: mat('#2f4a37', 0, .95),
  cape: mat('#5a2b27', 0, .95, { side: THREE.DoubleSide }), leather: mat('#4a3424', .1, .8), plume: mat('#8e3428'),
  stone: mat('#575049'), stoneD: mat('#3d3732'), stoneL: mat('#6b635a'), floor: mat('#3a332d'),
  wood: mat('#6b4a30'), woodD: mat('#3f2b1c'), woodL: mat('#8a6440'), cloth: mat('#6a3f35'), paper: mat('#e3d6bb'),
  grass: mat('#3e4a2c'), grassL: mat('#55633a'), dirt: mat('#2b241e'), iron: mat('#3a3a3c', .7, .5),
  glass: new THREE.MeshStandardMaterial({ color: '#9fc3d8', transparent: true, opacity: .22, roughness: .1, metalness: .2, depthWrite: false }),
};
const BM = {   // the courtyard buildings
  thatch: mat('#8f7848', 0, 1), shingle: mat('#4e3524'), slate: mat('#42474d', .1, .8), daub: mat('#a8916c'),
  clay: mat('#9a5a3a'), leaf: mat('#5f7d3c'), leafL: mat('#7c9a48'), water: mat('#5d7a86', .2, .25),
  ember: new THREE.MeshStandardMaterial({ color: '#ff7a2a', emissive: '#ff5a10', emissiveIntensity: 2.2, roughness: .6, flatShading: true, toneMapped: false }),
  lamp: new THREE.MeshStandardMaterial({ color: '#ffc46b', emissive: '#ffb050', emissiveIntensity: 1.6, roughness: .5, flatShading: true, toneMapped: false }),
};
const cyl = (rt, rb, h, seg = 8) => new THREE.CylinderGeometry(rt, rb, h, seg, 1);
const box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
const ico = (r, d = 0) => new THREE.IcosahedronGeometry(r, d);
const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _s = new THREE.Vector3(), _p = new THREE.Vector3();

// A mesh that moves (the knight, props): kept separate.
function part(parent, geo, material, pos = [0, 0, 0], o = {}) {
  const m = new THREE.Mesh(facet(geo, o.jitter ?? .01, o.seed ?? 0), material);
  m.position.set(...pos);
  if (o.rot) m.rotation.set(...o.rot);
  if (o.scale) m.scale.set(...o.scale);
  m.castShadow = o.cast ?? true; m.receiveShadow = true;
  parent.add(m);
  return m;
}
// A piece of the keep that never moves: baked into one mesh per material.
let bake = new Map();
function slab(geo, material, pos, o = {}) {
  geo = facet(geo, o.jitter ?? .03, o.seed ?? 0);
  _m4.compose(_p.set(...pos), _q.setFromEuler(_e.set(...(o.rot || [0, 0, 0]))), _s.set(...(o.scale || [1, 1, 1])));
  geo.applyMatrix4(_m4);
  if (!bake.has(material)) bake.set(material, []);
  bake.get(material).push(geo);
}
const solids = [];   // what the camera can't see through
function finishBake(group) {
  solids.length = 0;
  for (const [material, geos] of bake) {
    const mesh = new THREE.Mesh(mergeGeometries(geos, false), material);
    if (material !== M.dirt && material !== M.grass && material !== M.floor) solids.push(mesh);
    mesh.castShadow = material !== M.floor && material !== M.grass && material !== M.dirt;
    mesh.receiveShadow = true;
    group.add(mesh);
    geos.forEach(g => g.dispose());
  }
  bake = new Map();
}
// An invisible box you can click on to learn what something is.
const clickables = [];
function info(group, size, pos, title, sub) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(...size), new THREE.MeshBasicMaterial({ visible: false }));
  m.position.set(...pos); m.userData.info = { title, sub };
  group.add(m); clickables.push(m);
  return m;
}

// =====================================================================================
// The keep (rebuilt whenever the knight repairs something or makes something new)
// =====================================================================================
const WALL_H = .45;
function wallRun(axis, fixed, from, to, rowsAt, opening, seed) {
  const r = rand(seed);
  let a = from, col = 0;
  while (a < to - .05) {
    const len = Math.min(.75 + r() * .35, to - a);
    const rows = rowsAt(col, a + len / 2);
    for (let row = 0; row < rows; row++) {
      const off = (row % 2) * .22;
      const center = Math.min(to - len / 2, a + len / 2 + (row % 2 ? -off : 0));
      const y = row * WALL_H + WALL_H / 2;
      if (opening && opening(center, y)) continue;
      const pos = axis === 'x' ? [center, y, fixed] : [fixed, y, center];
      slab(box(axis === 'x' ? len - .03 : .6, WALL_H - .03, axis === 'x' ? .6 : len - .03),
           (row + col) % 3 === 0 ? M.stoneD : M.stone, pos, { seed: seed + col * 31 + row, jitter: .06 });
    }
    a += len; col++;
  }
}
function rubble(cx, cz, spread, count, seed, scaleAll = 1, group = null) {
  const r = rand(seed);
  for (let i = 0; i < count; i++) {
    const a = r() * Math.PI * 2, d = r() * spread, s = (.16 + r() * .22) * scaleAll;
    const pos = [cx + Math.cos(a) * d, s * .5 * (1 - d / spread * .5) + r() * .1 * scaleAll, cz + Math.sin(a) * d];
    slab(ico(s, 0), r() < .5 ? M.stone : M.stoneD, pos, { seed: seed + i, jitter: .08, scale: [1.2, .8, 1] });
  }
}
const progress = (st, key) => {
  const r = st?.keep?.repairs?.[key];
  return r ? Math.min(1, r.done / r.needed) : 0;
};

let worldGroup = null, worldKey = '', easelCanvas = null, hearthDone = false;
function buildWorld(st) {
  if (worldGroup) {
    scene.remove(worldGroup);
    worldGroup.traverse(o => { if (o.isMesh) { o.geometry.dispose(); if (o.material.map) o.material.map.dispose(); } });
  }
  clickables.length = 0;
  const g = worldGroup = new THREE.Group();
  scene.add(g);

  // ground: the hall's flagstones and the courtyard's grass (the land beyond is built once, in buildLand)
  const hall = new THREE.PlaneGeometry(11.2, 9.2, 22, 18); hall.rotateX(-Math.PI / 2);
  slab(hall, M.floor, [0, 0, 0], { jitter: .04 });
  for (let i = 0; i < 40; i++) slab(box(.9, .02, .9), i % 2 ? M.stoneD : M.floor,
    [-5 + (i % 10) * 1.1 + (hash(i, 1, 2) - .5) * .2, .005, -3.6 + Math.floor(i / 10) * 2.2], { jitter: .05, seed: i });
  const yard = new THREE.PlaneGeometry(11.9, 9.2, 22, 16); yard.rotateX(-Math.PI / 2);
  slab(yard, M.grass, [-11.25, .01, 0], { jitter: .08 });
  // a worn path from the door, past the well and the old tree, between the building plots
  const lane = new THREE.PlaneGeometry(10.6, 1.0, 20, 2); lane.rotateX(-Math.PI / 2);
  slab(lane, M.dirt, [-11.35, .02, .1], { jitter: .03 });
  for (let i = 0; i < 22; i++) slab(box(.34 + hash(i, 4, 4) * .2, .04, .3 + hash(i, 5, 5) * .15), i % 3 ? M.stoneL : M.stone,
    [-6.3 - i * .48 + (hash(i, 1, 1) - .5) * .15, .03, .1 + (hash(i, 2, 2) - .5) * .5], { rot: [0, hash(i, 3, 3), 0], jitter: .02, seed: i });

  // walls: north (with the window), west (with the doorway), east (collapsed), south (low, open to the view)
  const winP = progress(st, 'window'), doorP = progress(st, 'doorway'), wallP = progress(st, 'wall');
  wallRun('x', -4.3, -5.6, 5.6, (c, a) => 9 - (a > 2 ? Math.floor(hash(c, 3, 1) * 3) : 0),
          (a, y) => a > -3.35 && a < -1.85 && y > 1.3 && y < 3.15, 11);
  slab(box(1.8, .3, .7), M.stoneL, [-2.6, 3.3, -4.3], { jitter: .04 });                 // window lintel
  wallRun('z', -5.3, -4.3, 4.3, c => 8 - Math.floor(hash(c, 7, 2) * 2),
          (a, y) => a > .35 && a < 1.65 && y < 2.4, 23);
  slab(box(.7, .3, 1.6), M.stoneL, [-5.3, 2.55, 1.0], { jitter: .04 });                 // door lintel
  const eastRows = wallP >= 1 ? 9 : 2 + Math.round(wallP * 6);
  wallRun('z', 5.3, -4.3, 4.3, c => Math.max(1, eastRows - (wallP >= 1 ? 0 : Math.floor(hash(c, 5, 3) * 3))), null, 37);
  if (wallP < 1) rubble(4.4, 2.9, 1.2, Math.round(16 * (1 - wallP)), 41);
  wallRun('x', 4.3, -5.6, 5.6, c => 1 + Math.floor(hash(c, 9, 4) * 3), null, 53);
  // courtyard: low outer walls, a dead tree, an old well
  wallRun('z', -17.2, -4.3, 4.3, c => 2 + Math.floor(hash(c, 2, 8) * 2), null, 61);
  wallRun('x', -4.3, -17.2, -5.6, c => 2 + Math.floor(hash(c, 4, 8) * 2), null, 67);
  wallRun('x', 4.3, -17.2, -5.6, c => 1 + Math.floor(hash(c, 6, 8) * 2), null, 71);
  slab(cyl(.16, .24, 2.4, 6), M.woodD, [-8.8, 1.2, -2.2], { jitter: .05 });
  for (const [ry, rz, l, y] of [[.3, .9, 1.1, 1.9], [2.4, -.8, .9, 2.2], [4.2, .7, .8, 1.5], [1.2, -1.0, .7, 2.5]])
    slab(cyl(.05, .09, l, 5), M.woodD, [-8.8 + Math.cos(ry) * l * .35, y + .3, -2.2 + Math.sin(ry) * l * .35], { rot: [0, ry, rz], jitter: .03 });
  slab(cyl(.6, .65, .7, 9), M.stone, [-8.2, .35, 2.4], { jitter: .06 });
  slab(cyl(.45, .45, .72, 9), M.visor, [-8.2, .37, 2.4], { jitter: 0 });
  const builtOn = (x, z) => (st?.keep?.buildings || []).some(b => PLOTS[b.plot] && Math.abs(x - PLOTS[b.plot][0]) < 1.7 && Math.abs(z - PLOTS[b.plot][1]) < 1.5);
  for (let i = 0; i < 60; i++) {
    const x = -16.6 + hash(i, 5, 1) * 10.6, z = -3.8 + hash(i, 1, 7) * 7.6;
    if (Math.abs(z - .1) < .6 || builtOn(x, z)) continue;          // not on the path, not inside a building
    slab(new THREE.ConeGeometry(.06, .3 + hash(i, 2, 3) * .25, 4), i % 3 ? M.grassL : M.grass, [x, .15, z], { jitter: .02 });
  }
  info(g, [1.2, 2.6, 1.2], [-8.8, 1.3, -2.2], 'A dead tree in the courtyard', '');

  // the doorway: rubble until cleared, then a door hanging ajar
  if (doorP < 1) {
    rubble(-5.1, 1.0, .9, Math.round(14 * (1 - doorP)) + 2, 81, 1.3 - doorP * .6);
    info(g, [1.4, 1.6, 1.6], [-5.0, .8, 1.0], 'Rubble choking the doorway', `${Math.round(doorP * 100)}% cleared`);
  } else {
    slab(box(.08, 2.2, 1.1), M.woodD, [-4.75, 1.1, 1.85], { rot: [0, -1.1, 0], jitter: .02 });
    info(g, [.8, 2.3, 1.3], [-5.2, 1.15, 1.0], 'The doorway to the courtyard', 'cleared by the knight');
  }
  // the window: empty hole, then a frame, then glass and shutters
  if (winP > 0) {
    slab(box(1.5, .1, .14), M.woodD, [-2.6, 1.32, -4.02]); slab(box(1.5, .1, .14), M.woodD, [-2.6, 3.12, -4.02]);
    slab(box(.1, 1.8, .14), M.woodD, [-3.32, 2.22, -4.02]); slab(box(.1, 1.8, .14), M.woodD, [-1.88, 2.22, -4.02]);
    slab(box(.06, 1.8, .1), M.woodD, [-2.6, 2.22, -4.02]); slab(box(1.4, .06, .1), M.woodD, [-2.6, 2.22, -4.02]);
  }
  if (winP >= 1) {
    const glass = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 1.75), M.glass); glass.position.set(-2.6, 2.22, -4.0); g.add(glass);
    slab(box(.7, 1.7, .05), M.wood, [-3.75, 2.22, -3.75], { rot: [0, -1.1, 0], jitter: .02 });
    slab(box(.7, 1.7, .05), M.wood, [-1.45, 2.22, -3.75], { rot: [0, 1.1, 0], jitter: .02 });
  }
  info(g, [1.6, 1.9, .3], [-2.6, 2.22, -4.1], winP >= 1 ? 'The mended window' : 'The broken window',
       winP >= 1 ? 'glazed and shuttered by the knight' : `${Math.round(winP * 100)}% mended`);

  // the roof: open sky over the hall, beams and then planks over the north half as it's mended

// What visitors left by the door (the gifts it kept; logs went on the fire), in a small pile

const BOOK_COLORS = { 'book:sea': '#3d6e9e', 'book:stars': '#2b3a6b', 'book:tools': '#b0662a', 'book:birds': '#9e3b2f' };

function giftPile(g, gifts) {

  const r = rand(311);
  gifts.filter(x => x.startsWith('book:')).slice(-6).forEach((b, i) =>       // a stack of books
    slab(box(.26, .055, .2), mat(BOOK_COLORS[b] || '#6e6a3a', 0, .85), [-4.72, .03 + i * .058, -.95],
         { rot: [0, (r() - .5) * .5, 0], jitter: .004, seed: i }));

         { rot: [PI / 2, 0, .4 + i * .7], scale: [1, 1, .25], jitter: .003, seed: 60 + i });

         { rot: [0, (r() - .5) * .7, 0], jitter: .01, seed: 80 + i });

    .filter(Boolean);

  delighted:  t => ({ head: [-.06, 0, Math.sin(t * 3) * .1], bounce: Math.abs(Math.sin(t * 4)) * .016 }), // a little bounce
  amused:     t => ({ head: [0, Math.sin(t * 1.3) * .1, Math.sin(t * 2.2) * .08], bounce: Math.max(0, Math.sin(t * 6)) * .006 }),
  restless:   t => ({ torso: [0, Math.sin(t * .8) * .13, 0], head: [0, Math.sin(t * .9) * .45, 0] }), // shifting, looking around
  frustrated: t => ({ torso: [.06, 0, 0], head: [.12, (Math.sin(t * .5) > .6 ? Math.sin(t * 7) * .08 : 0), 0], handsOnHips: true }), // hands on hips, the odd head shake
  absorbed:   t => ({ head: [.15, 0, 0] }),                                                              // eyes on the work
  content:    t => ({ head: [0, 0, Math.sin(t * .4) * .06] }),                                           // easy, gently swaying
};

// -------------------------------------------------------------------------------------
// Little things visitors can do. All of this happens only on the visitor's own screen:
// nothing is saved or sent anywhere, so none of it ever reaches Rooken's mind.
// -------------------------------------------------------------------------------------
let reactStart = -10, reactUntil = -10, reactGlyph = '';
function greet() {          // click Rooken: it turns to you and waves (or mumbles in its sleep)
  const t = clock.elapsedTime;
  if (t < reactUntil - 1) return;     // already mid-wave
  reactStart = t; reactUntil = t + 2.6;
  reactGlyph = lie > .5 ? 'z z' : ['!', '♪', '♥', '!'][Math.floor(Math.random() * 4)];
}
const logs = [];
let logFlareUntil = -10, lastToss = -10;
function tossLog() {        // 🪵: a log arcs from where you are into the fire, which flares up
  const t = clock.elapsedTime;
  if (t - lastToss < 2.5) return;
  lastToss = t;
  const dir = new THREE.Vector3(); camera.getWorldDirection(dir);
  const start = camera.position.clone().addScaledVector(dir, .6); start.y -= .35;
  const end = new THREE.Vector3((Math.random() - .5) * .15, .2, (Math.random() - .5) * .15);
  const mesh = new THREE.Mesh(facet(cyl(.045, .05, .5, 6), .015), M.woodD);
  mesh.castShadow = true; scene.add(mesh);
  const far = start.distanceTo(end);
  logs.push({ mesh, start, end, t0: t, dur: Math.min(1.5, .45 + far * .12), lift: .7 + far * .12,
              spin: new THREE.Vector3(Math.random() * 7, Math.random() * 7, Math.random() * 7) });
}
$('logbtn').onclick = e => { tossLog(); e.currentTarget.blur(); };

function setSword(planted) {
  if (planted === swordOut) return;
  swordOut = planted;
  if (planted) { K.root.add(K.sword); K.sword.position.set(0, .86, .31); K.sword.rotation.set(0, 0, 0); }
  else { K.scabbard.add(K.sword); K.sword.position.set(0, -.05, 0); K.sword.rotation.set(0, 0, 0); }
}
setSword(false);

function tick(nowMs) {
  const dt = Math.min(clock.getDelta(), .25), t = clock.elapsedTime, now = Date.now();
  const k = 1 - Math.exp(-dt * 7);
  const goal = current(now);
  const spot0 = SPOTS[goal.place] || SPOTS.fire;
  const spot = (goal.action === 'sit' || goal.action === 'read') && spot0.sit ? { ...spot0.sit, label: spot0.label } : spot0;
  const target = new THREE.Vector3(spot.p[0], 0, spot.p[1]);
  if (goal.action === 'pace') {
    const side = new THREE.Vector3(Math.cos(spot.yaw), 0, -Math.sin(spot.yaw));
    target.addScaledVector(side, Math.sin(t * .4) * .8);
  }
  const key = goal.place + '|' + goal.action;
  if (key !== goalKey) {
    if (!goalKey) { pos.copy(target); yaw = spot.yaw; lie = goal.action === 'sleep' ? 1 : 0; path = []; }   // first frame: just be there
    else path = route(pos, target);
    goalKey = key;
  }
  // walk the path, or settle into the pose. In a reflective mood it strolls, hands behind its back
  // (unless it's off to work, which it does with purpose).
  let pose, moving = false;
  const strolling = REFLECTIVE.includes(state?.plan?.mood) && !['work', 'vigil'].includes(goal.action);
  if (goal.action === 'pace' && !path.length && lie < .05) {     // pacing back and forth on the spot
    const before = pos.clone(); pos.copy(target);
    const v = pos.distanceTo(before);
    if (v > 1e-4) {
      moving = v > .002; phase += v * 6.2;
      const want = Math.atan2(pos.x - before.x, pos.z - before.z);
      yaw += Math.atan2(Math.sin(want - yaw), Math.cos(want - yaw)) * Math.min(1, dt * 5);
    }
    pose = poseFor(moving ? 'stroll' : 'muse', spot, t, phase);   // pacing in thought: hands behind its back
  } else if (path.length) {
    if (lie > .05) pose = poseFor('stand', spot, t, phase);    // get up first
    else {
      const next = path[0], d = next.clone().sub(pos); d.y = 0;
      const dist = d.length(), step = Math.min(dist, (strolling ? .65 : 1.0) * dt);
      if (dist < .03) path.shift();
      else {
        pos.addScaledVector(d.normalize(), step); phase += step * 6.2; moving = true;
        const want = Math.atan2(d.x, d.z);
        yaw += Math.atan2(Math.sin(want - yaw), Math.cos(want - yaw)) * Math.min(1, dt * 6);
      }
      pose = poseFor(strolling ? 'stroll' : 'walk', spot, t, phase);
    }
  } else {
    pose = poseFor(goal.action, spot, t, phase);
    if (!((t < reactUntil || t < hearUntil) && lie < .3)) yaw += Math.atan2(Math.sin(spot.yaw - yaw), Math.cos(spot.yaw - yaw)) * Math.min(1, dt * 4);
  }
  // say hello: standing, it turns to face you; seated, it just looks up. Either way it waves.
  const seated = (pose.hipsY ?? .95) < .8;
  const awayAngle = () => {   // where you are, relative to where it faces
    const local = K.root.worldToLocal(camera.position.clone());
    return THREE.MathUtils.clamp(Math.atan2(local.x, local.z), -.9, .9);
  };
  if (t < reactUntil && !moving && lie < .3) {
    if (!seated) {
      const toCam = Math.atan2(camera.position.x - pos.x, camera.position.z - pos.z);
      yaw += Math.atan2(Math.sin(toCam - yaw), Math.cos(toCam - yaw)) * Math.min(1, dt * 5);
    }
    const wave = Math.sin((t - reactStart) * 9) * .3;
    const head = pose.joints.head || [0, 0, 0];
    pose = { ...pose, book: undefined,
             joints: { ...pose.joints, shL: [-2.75, 0, .35 + wave], elL: [-.35, 0, 0], head: [Math.min(head[0], .1), awayAngle(), 0] },
             ik: pose.ik?.R ? { R: pose.ik.R } : undefined };
  }
  // its mood, acted out with its whole body (a helmet hides any face)
  const moodPose = MOOD_POSE[state?.plan?.mood]?.(t);
  if (moodPose && lie < .3 && !(t < reactUntil)) {
    const j = { ...pose.joints };
    if (moodPose.torso) j.torso = addJ(j.torso, moving ? [moodPose.torso[0], 0, 0] : moodPose.torso);
    if (moodPose.head) j.head = addJ(j.head, moving ? [moodPose.head[0] * .6, 0, 0] : moodPose.head);   // walking: eyes ahead
    if (moodPose.droop && !pose.ik) { j.shL = addJ(j.shL, [0, 0, -.07]); j.shR = addJ(j.shR, [0, 0, .07]); }
    let hipsY = pose.hipsY, ik = pose.ik;
    if (!moving && !seated && moodPose.bounce) hipsY += moodPose.bounce;
    if (moodPose.handsOnHips && !moving && !seated && !pose.ik && !pose.tool) ik = { L: [.23, .98, .02], R: [-.23, .98, .02] };
    pose = { ...pose, joints: j, hipsY, ik };
  }
  // it notices when you come close: glances your way (and shows how it's feeling, below)
  K.J.hips.getWorldPosition(hipsWorld);
  const camDist = camera.position.distanceTo(hipsWorld);
  const closeNow = camDist < 1.9 && !moving && lie < .3 && goal.action !== 'sleep' && !(t < reactUntil);
  if (closeNow) {
    const head = pose.joints.head || [0, 0, 0];
    pose = { ...pose, joints: { ...pose.joints, head: [head[0] * .5, awayAngle() * .7, head[2]] } };
  }
  // a knock at the gate: it looks toward the door, turning a little if it's standing (asleep, it stirs)
  if (t < hearUntil && !(t < reactUntil) && !moving && lie < .3) {
    const local = K.root.worldToLocal(DOOR.clone());
    const head = pose.joints.head || [0, 0, 0];
    pose = { ...pose, joints: { ...pose.joints, head: [Math.min(head[0], .05), THREE.MathUtils.clamp(Math.atan2(local.x, local.z), -1.2, 1.2), 0] } };
    if (!seated) {
      const toDoor = Math.atan2(DOOR.x - pos.x, DOOR.z - pos.z);
      yaw += Math.atan2(Math.sin(toDoor - yaw), Math.cos(toDoor - yaw)) * Math.min(1, dt * 1.5);
    }
  }
  setSword(!!pose.sword && !moving);
  lie += ((pose.lie ? 1 : 0) - lie) * k * .6;

  K.root.position.set(pos.x, groundAt(pos.x, pos.z) + lie * .17, pos.z);
  K.root.quaternion.setFromEuler(_e.set(-lie * PI / 2, 0, 0, 'YXZ')).premultiply(_qa.setFromAxisAngle(UP, yaw));
  K.J.hips.position.y += (pose.hipsY - K.J.hips.position.y) * k;
  for (const name of JOINTS) K.J[name].quaternion.slerp(toQ(pose.joints[name] || [0, 0, 0]), k);
  if (pose.ik) {
    K.root.updateMatrixWorld(true);
    for (const side of ['L', 'R']) if (pose.ik[side]) {
      const [qa, qb] = reach(K.arms[side], new THREE.Vector3(...pose.ik[side]));
      K.J['sh' + side].quaternion.slerp(qa, k); K.J['el' + side].quaternion.slerp(qb, k);
    }
  }
  const grip = pose.grip ?? .35;
  for (const arm of Object.values(K.arms)) {
    const c = -arm.side * grip;
    arm.knuckle.rotation.z += (c - arm.knuckle.rotation.z) * k;
    arm.tip.rotation.z += (c * 1.1 - arm.tip.rotation.z) * k;
    arm.thumb.rotation.x += (-.5 - grip * .5 - arm.thumb.rotation.x) * k;
  }
  K.book.visible = !!pose.book && !moving;
  if (K.book.visible) { K.book.position.set(...pose.book); K.book.rotation.set(-.5, 0, 0); }
  for (const [name, tool] of Object.entries(K.tools)) tool.visible = pose.tool === name && !moving;

  // the cape stirs, more when walking
  const cp = K.cape.geometry.attributes.position, rest = K.cape.userData.rest;
  for (let i = 0; i < cp.count; i++) {
    const x = rest[i * 3], v = -rest[i * 3 + 1] / 1.02;
    cp.setZ(i, -v * v * (.1 + (moving ? .12 : 0)) * (1 + Math.sin(t * 1.7 + x * 6 + v * 3) * .35) - v * .05
               - (pose.behind ? .11 * Math.min(1, v * 2.5) : 0));   // hands behind its back: the cape sits out over them
  }
  cp.needsUpdate = true; K.cape.geometry.computeVertexNormals();

  // logs visitors toss, flying into the fire
  for (let i = logs.length - 1; i >= 0; i--) {
    const L = logs[i], u = (t - L.t0) / L.dur;
    if (u >= 1) { scene.remove(L.mesh); L.mesh.geometry.dispose(); logs.splice(i, 1); logFlareUntil = t + 3.5; continue; }
    L.mesh.position.lerpVectors(L.start, L.end, u);
    L.mesh.position.y += Math.sin(u * PI) * L.lift;
    L.mesh.rotation.set(L.spin.x * u, L.spin.y * u, L.spin.z * u);
    shadowsDirty = true;
  }
  // fire (it flares when the knight is truly awake and thinking, or when a log lands)
  const logFlare = t < logFlareUntil ? 1 + .65 * ((logFlareUntil - t) / 3.5) : 1;
  const flare = Math.max(goal.awake ? 1.35 : 1, logFlare), warm = hearthDone ? 1.15 : 1;
  fireLight.intensity = (32 + Math.sin(t * 9) * 3 + Math.sin(t * 23) * 2 + Math.sin(t * 4.1) * 2) * flare * warm * fireDim;
  for (const f of flames) {
    const s = (.8 + Math.sin(t * f.userData.speed + f.userData.phase) * .2 + Math.random() * .06) * flare;
    f.scale.set(1, s, 1); f.position.y = .15 + f.userData.h * s / 2; f.rotation.y += dt * 1.5;
  }
  candle.intensity = (1.1 + Math.sin(t * 13) * .15) * fireDim; candleFlame.scale.y = 1 + Math.sin(t * 17) * .2;
  if (candleFlames.length) {   // visitors' candles in the window
    windowGlow.intensity = (.5 + Math.sqrt(candleFlames.length) * .35) * (1 + Math.sin(t * 11) * .08 + Math.sin(t * 5.3) * .05);
    for (const f of candleFlames) f.scale.y = 1 + Math.sin(t * 15 + f.userData.phase) * .22;
  } else windowGlow.intensity = 0;
  for (let i = 0; i < EMBERS; i++) {
    emberLife[i] += dt * (.25 + (i % 5) * .05) * flare * wxCalm; if (emberLife[i] > 1) emberLife[i] = 0;
    const L = emberLife[i], a = i * 2.39;
    emberPos[i * 3] = Math.cos(a) * .12 + Math.sin(t + i) * .1 * L;
    emberPos[i * 3 + 1] = .25 + L * 1.3;
    emberPos[i * 3 + 2] = Math.sin(a) * .12 + Math.cos(t * .8 + i) * .1 * L;
  }
  emberGeo.attributes.position.needsUpdate = true;

  // speech bubble over its helm; when that spot is off screen (camera close), beside the helm instead
  K.J.head.getWorldPosition(headWorld);
  const headScreen = headWorld.clone().project(camera);
  headWorld.y += lie > .5 ? .35 : .45;
  headWorld.project(camera);
  let bx = (headWorld.x + 1) / 2 * innerWidth, by = (1 - headWorld.y) / 2 * innerHeight;
  if (by < 70) {
    bx = (headScreen.x + 1) / 2 * innerWidth + Math.min(innerWidth * .18, 160);
    by = THREE.MathUtils.clamp((1 - headScreen.y) / 2 * innerHeight, 110, innerHeight - 90);
  }
  const edge = bubbleIsThought ? Math.min(140, innerWidth / 2) : 40;   // wide thought bubbles stay on screen
  bubble.style.left = THREE.MathUtils.clamp(bx, edge, innerWidth - edge) + 'px';
  bubble.style.top = by + 'px';
  let show = false;
  if (goal.awake) {        // really thinking right now: its actual waking thought, between the dots
    show = true;
    const th = goal.thought && Math.floor(t / 6) % 2 === 0 ? goal.thought : '';
    bubble.textContent = th || '.'.repeat(1 + Math.floor(t * 2) % 3);
    bubbleIsThought = !!th;
  } else if (!moving && nowMs > nextBubble) {   // now and then: a passing thought, or how it feels
    const th = Math.random() < .65 ? pickThought(goal, now) : '';
    bubble.textContent = th || GLYPH[goal.emote] || '…';
    bubbleIsThought = !!th;
    bubbleUntil = nowMs + (th ? 7000 : 3800);
    nextBubble = nowMs + 11000 + Math.random() * 8000;
  }
  // when you come close, it lets you see what's on its mind (or how it's feeling)
  if (closeNow && !wasClose && !goal.awake && !moving) {
    const th = pickThought(goal, now);
    bubble.textContent = th || GLYPH[goal.emote] || '…'; bubbleIsThought = !!th;
    bubbleUntil = nowMs + (th ? 6500 : 3500); nextBubble = nowMs + 11000 + Math.random() * 5000;
  }
  wasClose = closeNow ? true : (camDist > 2.4 ? false : wasClose);   // a little slack, so it doesn't flicker
  if (!goal.awake) show = !moving && nowMs < bubbleUntil;
  const greeting = t < reactUntil, hearing = !greeting && t < hearUntil;
  if (greeting) { show = true; bubble.textContent = reactGlyph; bubbleIsThought = false; }
  if (hearing) { show = true; bubble.textContent = hearGlyph; bubbleIsThought = false; }
  bubble.style.opacity = show && headScreen.z < 1 ? 1 : 0;
  bubble.className = 'bubble ' + (greeting ? (reactGlyph === '♥' ? 'heart' : reactGlyph === '♪' ? 'music' : '')
                                 : hearing ? (hearGlyph === '!' ? 'exclaim' : hearGlyph === '?' ? 'question' : 'zzz')
                                           : bubbleIsThought ? 'thought' : (goal.emote || ''));

  // caption and badge
  // unwell: several check-ins failed in a row, or none got through for half a day (its alarm
  // may have stopped). Either way the keeper should take a look.
  function seemsUnwell() {
    if (DEMO) return /[?&]unwell/.test(location.search);
    if (state?.health?.unwell) return true;
    const at = Date.parse(state?.needs_at || '');
    return at > 0 && Date.now() - at > 12 * 3600e3;
  }
  const first = (state?.identity?.name || 'The knight').split(' ')[0];
  const doing = moving && goal.action !== 'pace' ? `walking ${(spot.label || '').replace(/^\w+ the /, 'to the ')}`
              : goal.place.startsWith('repair:') ? spot.label : `${DOING[goal.action] || goal.action} ${spot.label || ''}`;
  const caption = state?.identity?.name || DEMO ? `${first} is ${doing.trim()}.${goal.note ? `<em>${esc(goal.note)}</em>` : ''}`
                                                : `A knight sleeps in the ruined keep.<em>${esc(goal.note)}</em>`;
  if (caption !== lastCaption) { $('caption').innerHTML = caption; lastCaption = caption; }
  const unwell = !goal.awake && seemsUnwell();
  $('badge').className = goal.awake ? 'awake' : unwell ? 'unwell' : '';
  $('badge').textContent = goal.awake ? 'awake, thinking' : unwell ? 'seems unwell'
                         : (state?.plan?.mood ? `feeling ${state.plan.mood}` : 'resting');
  $('badge').title = unwell ? "Its last few check-ins didn't go through. It should be back soon." : '';

  for (const zn of buildingZones) {
    const show = !(zoneAt(pos.x, pos.z) === zn || zoneAt(camera.position.x, camera.position.z, .2) === zn);
    if (zn.roof.visible !== show) { zn.roof.visible = show; shadowsDirty = true; }
  }
  yardGlow.intensity = yardGlowBase * (.85 + .1 * Math.sin(t * 7.3) + .05 * Math.sin(t * 17.1));

  updateCamera(dt);
  if (camMode === 'follow') controls.update();   // in free mode we steer the camera ourselves
  // shadows: redrawn a few times a second (the light itself flickers every frame)
  const hz = QUALITY[qLevel].hz;
  if (fireLight.castShadow && (shadowsDirty || (hz && nowMs - lastShadow > 1000 / hz))) {
    renderer.shadowMap.needsUpdate = true; lastShadow = nowMs; shadowsDirty = false;
  }
  weatherTick(t, dt);
  for (const f of onTick) f(t, dt);
  renderer.render(scene, camera);
  watchSpeed(nowMs);
  requestAnimationFrame(tick);
}

// =====================================================================================
// Start
// =====================================================================================
async function refresh() {
  if (DEMO || ASSETS === null) return;
  try {
    const r = await fetch(`${ASSETS}data/state.json?t=${Date.now()}`, { cache: 'no-store' });
    if (r.ok) applyState(await r.json(), true);
  } catch { /* the knight is between pages; try again later */ }
}
scene.add(buildLand());
addWeather();
updateSky(); setInterval(updateSky, 60000);
applyQuality(qLevel);
setCam('follow');
if (DEMO) state = demoState();
applyState(state || {});
refresh(); setInterval(refresh, 60000);
refreshVisits(); setInterval(refreshVisits, 150000);   // ~24 times an hour at most, well within GitHub's limit
resize();
requestAnimationFrame(tick);
window.__keep = { K, camera, controls, goodView, greet, tossLog,
  bench(frames = 120) {   // for testing: milliseconds per frame, rendered back to back (works even in a hidden tab)
    const gl = renderer.getContext(), t0 = performance.now();
    for (let i = 0; i < frames; i++) { weatherTick(clock.elapsedTime + i / 60, 1 / 60); renderer.render(scene, camera); }
    gl.finish(); return +((performance.now() - t0) / frames).toFixed(2);
  }, get quality() { return qLevel; }, setQuality: applyQuality,
  view(p, at) {   // free camera at p, looking at `at` (for testing)
    if (camMode !== 'free') setCam('free');
    camera.position.set(...p); camera.lookAt(...at);
    const e = new THREE.Euler().setFromQuaternion(camera.quaternion, 'YXZ'); lookYaw = e.y; lookPitch = e.x; flyVel.set(0, 0, 0);
  },
  updateSky, visitorArrived,
  setCreatures(list) { state = { ...(state || {}), creatures: { seeing: 4, current: list } }; return showBeings().then(() => beings.size); },   // testing
  get beingsHere() { return [...beings.keys()]; },
  setCandles: n => { liveCandles = { n, at: Date.now() }; state = { ...(state || {}), visits: { candles_tonight: n } }; showCandles(); },
  setMood: m => { state = { ...(state || {}), plan: { ...(state?.plan || {}), mood: m } }; },
  get logsInFlight() { return logs.map(l => l.mesh.position.toArray().map(v => +v.toFixed(2))); },
  get flareLeft() { return +(logFlareUntil - clock.elapsedTime).toFixed(2); }, get fireIntensity() { return +fireLight.intensity.toFixed(1); } };
const creatureApi = () => ({
  THREE, scene, camera, M, BM, mat, part, facet, hash, rand, cyl, box, ico, onTick, K, fireLight, updateSky, toast, ground: landHeight,
  view: window.__keep.view, setHour(h) { skyHour = h; updateSky(); }, get hour() { return skyHour; },
  setFireDim(v) { fireDim = v; }, force(goal) { window.__force = goal; },
});
const loadCreatures = () => import(`${ASSETS || './'}creatures.js?v=${Date.now()}`);   // always the newest, never a cached copy
if (CREATURE) loadCreatures().then(m => m.start(CREATURE, creatureApi())).catch(e => console.error('creature preview', e));

// Beings at the keep (state.creatures, once they are switched on): fetched only when one is
// coming, placed while it is here, taken away when it leaves. Everyone sees the same ones.
async function showBeings() {
  if (CREATURE || !beingsReady) return;   // the preview shows its own
  const now = Date.now(), list = state?.creatures?.current || [];
  if (list.length && !creatureMod) creatureMod = await loadCreatures().catch(() => null);   // fetched ahead, while it's still on its way
  if (!creatureMod) return;
  const here = list.filter(a => Date.parse(a.start) <= now && now < Date.parse(a.end));
  for (const [id, b] of beings) if (!here.some(a => a.id === id)) { b?.remove(); beings.delete(id); }
  for (const a of here) if (!beings.has(a.id)) beings.set(a.id, creatureMod.spawn(a.render || a.kind, creatureApi(), a));
}
beingsReady = true; showBeings(); setInterval(showBeings, 30000);
</script>
